name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 */3 * *'   # ทุก ~3 วัน กันโปรเจกต์ถูกพัก
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/config?select=id&limit=1"
          -H "apikey: ${{ secrets.SUPABASE_KEY }}"
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
